<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЦАМИ Дашборд</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #222);
            padding: 16px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        
        .header { 
            background: var(--tg-theme-secondary-bg-color, #e0e0e0);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .back-button {
            background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, white);
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: opacity 0.2s;
        }
        
        .back-button:active {
            opacity: 0.7;
        }
        
        .back-button span {
            font-size: 18px;
        }
        
        .header-title {
            flex: 1;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            color: #43A047;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .stat-card {
            background: var(--tg-theme-button-color, #43A047);
            color: var(--tg-theme-button-text-color, white);
            padding: 12px 8px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .stat-card.active {
            opacity: 1;
            box-shadow: 0 0 0 2px var(--tg-theme-text-color, black), 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .stat-label { font-size: 12px; margin-bottom: 4px; opacity: 0.9; }
        .stat-value { font-size: 20px; font-weight: bold; }
        .stat-small { font-size: 11px; opacity: 0.8; margin-top: 4px; }
        
        .chart-container {
            background: var(--tg-theme-secondary-bg-color, #e0e0e0);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            height: 300px;
        }
        
        .details-table {
            background: var(--tg-theme-secondary-bg-color, #e0e0e0);
            padding: 16px;
            border-radius: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .details-table h3 {
            margin-bottom: 12px;
            color: #43A047;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        
        th { 
            font-weight: 600;
            background: rgba(67, 160, 71, 0.1);
            border-radius: 8px 8px 0 0;
        }
        
        tr:last-child td {
            border-bottom: none;
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 16px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            background: var(--tg-theme-secondary-bg-color, #e0e0e0);
            border-radius: 12px;
        }
        
        .update-time {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #666);
            margin-top: 4px;
        }
        
        .summary-stats {
            background: var(--tg-theme-secondary-bg-color, #e0e0e0);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .total-value {
            font-size: 24px;
            font-weight: bold;
            color: #43A047;
        }
        
        .total-label {
            font-size: 14px;
            opacity: 0.8;
        }

        .placeholder {
            background: var(--tg-theme-secondary-bg-color, #e0e0e0);
            padding: 40px 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 16px;
        }
        
        .placeholder-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .placeholder-text {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-button" onclick="goBack()">
                <span>←</span> Назад
            </button>
            <div class="header-title">
                <span>🏛️ ЦАМИ Дашборд</span>
            </div>
            <div style="width: 60px;"></div>
        </div>
        
        <div class="placeholder">
            <div class="placeholder-icon">🏛️</div>
            <div class="placeholder-text">
                <strong>Дашборд ЦАМИ в разработке</strong><br><br>
                Здесь будет отображаться статистика по ЦАМИ.<br>
                Для подключения обратитесь к администратору.
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Сегодня</div>
                <div class="stat-value">-</div>
                <div class="stat-small">ср. -</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Неделя</div>
                <div class="stat-value">-</div>
                <div class="stat-small">ср. -</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Месяц</div>
                <div class="stat-value">-</div>
                <div class="stat-small">ср. -</div>
            </div>
        </div>
        
        <div class="chart-container">
            <canvas id="tsamiChart"></canvas>
        </div>
        
        <div class="details-table">
            <h3>📋 Данные ЦАМИ</h3>
            <table id="data-table">
                <thead>
                    <tr>
                        <th>Дата</th>
                        <th>Кол-во</th>
                        <th>Статус</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr>
                        <td colspan="3" style="text-align: center; padding: 20px; color: #999;">
                            Ожидание данных...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        let chart = null;
        
        function goBack() {
            window.location.href = 'index.html';
        }
        
        function initChart() {
            const ctx = document.getElementById('tsamiChart').getContext('2d');
            
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Нет данных'],
                    datasets: [{
                        label: 'ЦАМИ',
                        data: [0],
                        borderColor: '#43A047',
                        backgroundColor: 'rgba(67, 160, 71, 0.1)',
                        tension: 0.1,
                        fill: true,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true },
                        x: { display: false }
                    }
                }
            });
        }
        
        initChart();
        
        tg.MainButton.setText('На главную');
        tg.MainButton.onClick(() => {
            window.location.href = 'index.html';
        });
        tg.MainButton.show();
    </script>
</body>
</html>
