<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMK Дашборды</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #222);
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .header { 
            background: var(--tg-theme-secondary-bg-color, #e0e0e0);
            padding: 24px 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            text-align: center;
        }
        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .header p {
            opacity: 0.8;
            font-size: 14px;
        }
        
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .menu-item {
            background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, white);
            padding: 24px 12px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: none;
            width: 100%;
            font-size: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .menu-item:active {
            transform: scale(0.98);
            opacity: 0.8;
        }
        
        .menu-item span {
            font-size: 32px;
            margin-bottom: 8px;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: var(--tg-theme-hint-color, #999);
            font-size: 12px;
        }
        
        .version {
            background: var(--tg-theme-secondary-bg-color, #e0e0e0);
            padding: 8px 12px;
            border-radius: 20px;
            display: inline-block;
            font-size: 12px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 TMK Аналитика</h1>
            <p>Выберите раздел для просмотра статистики</p>
        </div>
        
        <div class="menu-grid">
            <a href="max.html" class="menu-item" style="background: #1E88E5;">
                <span>📈</span>
                MAX
            </a>
            <a href="tsami.html" class="menu-item" style="background: #43A047;">
                <span>🏛️</span>
                ЦАМИ
            </a>
            <a href="tz.html" class="menu-item" style="background: #FB8C00;">
                <span>📋</span>
                Технические задания
            </a>
            <a href="datalens.html" class="menu-item" style="background: #8E24AA;">
                <span>📊</span>
                DataLens
            </a>
        </div>
        
        <div class="footer">
            <div class="version">v2.0 • Мультидашборд</div>
        </div>
    </div>
    
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        tg.MainButton.setText('Закрыть');
        tg.MainButton.onClick(() => tg.close());
    </script>
</body>
</html>
